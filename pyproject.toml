[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "braidtex"
version = "0.3.0"
description = "Mathematical braid notation, automatic layout, and cached TikZ preprocessing for LaTeX"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "BraidTeX contributors" }]
dependencies = []

[project.scripts]
braidtex = "braidtex_cli:main"

[tool.setuptools]
py-modules = ["braidtex", "braidtex_layout", "braidtex_geometry", "braidtex_parser", "braidtex_transform", "braidtex_cli"]
packages = ["braidtex_data"]

[tool.setuptools.package-data]
braidtex_data = ["braidtex.sty"]
