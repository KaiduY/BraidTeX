[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "braidtex"
version = "0.1.0"
description = "Mathematical authoring system for braid diagrams"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
braidtex = "braidtex.cli:main"

[tool.setuptools]
packages = ["braidtex"]
